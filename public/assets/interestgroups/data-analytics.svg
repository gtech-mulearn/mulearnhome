<svg width="400" height="250" viewBox="0 0 400 250" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="analyticsGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d9488;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0284c7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="400" height="250" fill="url(#analyticsGrad)" rx="16"/>
  <circle cx="80" cy="125" r="120" fill="rgba(255,255,255,0.08)"/>
  <circle cx="320" cy="200" r="80" fill="rgba(255,255,255,0.06)"/>

  <g transform="translate(200, 95)" filter="url(#glow)">
    <line x1="-50" y1="20" x2="50" y2="20" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>
    <rect x="-40" y="0" width="12" height="20" rx="2" fill="#38bdf8"/>
    <rect x="-20" y="-15" width="12" height="35" rx="2" fill="#2dd4bf"/>
    <rect x="0" y="-5" width="12" height="25" rx="2" fill="#818cf8"/>
    <rect x="20" y="-22" width="12" height="42" rx="2" fill="#34d399"/>
    <path d="M-34,0 L-14,-15 L6,-5 L26,-22" stroke="white" stroke-width="2.5" fill="none"/>
  </g>

  <text x="200" y="165" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="white" text-anchor="middle" filter="url(#glow)">Data Analytics</text>

  <text x="200" y="208" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="rgba(255,255,255,0.9)" text-anchor="middle">µLearn</text>
</svg>