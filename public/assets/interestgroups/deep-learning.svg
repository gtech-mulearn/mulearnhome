<svg width="400" height="250" viewBox="0 0 400 250" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="aimlGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4338ca;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#6d28d9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="400" height="250" fill="url(#aimlGrad)" rx="16"/>
  <circle cx="80" cy="125" r="120" fill="rgba(255,255,255,0.08)"/>
  <circle cx="320" cy="200" r="80" fill="rgba(255,255,255,0.06)"/>

  <g transform="translate(200, 95)" filter="url(#glow)">
    <line x1="-30" y1="-15" x2="0" y2="-28" stroke="#a78bfa" stroke-width="2"/>
    <line x1="30" y1="-15" x2="0" y2="-28" stroke="#a78bfa" stroke-width="2"/>
    <line x1="-30" y1="-15" x2="-35" y2="10" stroke="#818cf8" stroke-width="2"/>
    <line x1="30" y1="-15" x2="35" y2="10" stroke="#818cf8" stroke-width="2"/>
    <line x1="-35" y1="10" x2="0" y2="22" stroke="#c084fc" stroke-width="2"/>
    <line x1="35" y1="10" x2="0" y2="22" stroke="#c084fc" stroke-width="2"/>
    <circle cx="0" cy="-28" r="4" fill="#f472b6" stroke="white"/>
    <circle cx="-30" cy="-15" r="4" fill="#c084fc" stroke="white"/>
    <circle cx="30" cy="-15" r="4" fill="#c084fc" stroke="white"/>
    <circle cx="-35" cy="10" r="4" fill="#818cf8" stroke="white"/>
    <circle cx="35" cy="10" r="4" fill="#818cf8" stroke="white"/>
    <circle cx="0" cy="22" r="4" fill="#38bdf8" stroke="white"/>
  </g>

  <text x="200" y="165" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="white" text-anchor="middle" filter="url(#glow)">Deep Learning</text>

  <text x="200" y="208" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="rgba(255,255,255,0.9)" text-anchor="middle">µLearn</text>
</svg>