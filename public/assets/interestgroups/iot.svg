<svg width="400" height="250" viewBox="0 0 400 250" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="iotGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f97316;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#c2410c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="400" height="250" fill="url(#iotGrad)" rx="16"/>
  <circle cx="80" cy="125" r="120" fill="rgba(255,255,255,0.08)"/>
  <circle cx="320" cy="200" r="80" fill="rgba(255,255,255,0.06)"/>

  <g transform="translate(200, 95)" filter="url(#glow)">
    <rect x="-20" y="-20" width="40" height="40" rx="6" fill="#ea580c" stroke="white" stroke-width="2"/>
    <circle cx="0" cy="0" r="8" fill="white"/>
    <line x1="-20" y1="-10" x2="-28" y2="-10" stroke="white" stroke-width="2"/>
    <line x1="-20" y1="10" x2="-28" y2="10" stroke="white" stroke-width="2"/>
    <line x1="20" y1="-10" x2="28" y2="-10" stroke="white" stroke-width="2"/>
    <line x1="20" y1="10" x2="28" y2="10" stroke="white" stroke-width="2"/>
  </g>

  <text x="200" y="165" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="white" text-anchor="middle" filter="url(#glow)">IoT &amp; Robotics</text>

  <text x="200" y="208" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="rgba(255,255,255,0.9)" text-anchor="middle">µLearn</text>
</svg>