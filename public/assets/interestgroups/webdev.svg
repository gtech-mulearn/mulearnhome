<svg width="400" height="250" viewBox="0 0 400 250" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="webdevGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#4338ca;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="400" height="250" fill="url(#webdevGrad)" rx="16"/>
  <circle cx="80" cy="125" r="120" fill="rgba(255,255,255,0.08)"/>
  <circle cx="320" cy="200" r="80" fill="rgba(255,255,255,0.06)"/>

  <g transform="translate(200, 95)" filter="url(#glow)">
    <rect x="-35" y="-22" width="70" height="44" rx="6" fill="#1e1b4b" stroke="white" stroke-width="2"/>
    <circle cx="-25" cy="-14" r="2" fill="#ef4444"/>
    <circle cx="-19" cy="-14" r="2" fill="#eab308"/>
    <circle cx="-13" cy="-14" r="2" fill="#22c55e"/>
    <path d="M-20,-2 L-10,4 L-20,10" stroke="#818cf8" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <line x1="-4" y1="10" x2="10" y2="10" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <text x="200" y="165" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="white" text-anchor="middle" filter="url(#glow)">Web Development</text>

  <text x="200" y="208" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="rgba(255,255,255,0.9)" text-anchor="middle">µLearn</text>
</svg>