<svg width="400" height="250" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="quantumGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#eab308;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e1b4b;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="400" height="250" fill="url(#quantumGrad)" rx="16"/>

  <circle cx="80" cy="125" r="120" fill="rgba(255,255,255,0.1)"/>
  <circle cx="320" cy="200" r="80" fill="rgba(255,255,255,0.08)"/>

  <g transform="translate(200, 95)" filter="url(#glow)">
    <circle cx="0" cy="0" r="6" fill="white"/>
    <ellipse cx="0" cy="0" rx="34" ry="14" stroke="white" stroke-width="2.5" fill="none"/>
    <ellipse cx="0" cy="0" rx="34" ry="14" stroke="white" stroke-width="2.5" fill="none" transform="rotate(60)"/>
    <ellipse cx="0" cy="0" rx="34" ry="14" stroke="white" stroke-width="2.5" fill="none" transform="rotate(120)"/>
    <circle cx="34" cy="0" r="4" fill="white" transform="rotate(60)"/>
    <circle cx="-34" cy="0" r="4" fill="white" transform="rotate(120)"/>
  </g>

  <text x="200" y="165" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="white" text-anchor="middle" filter="url(#glow)">Quantum Computing</text>

  <text x="200" y="190" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="rgba(255,255,255,0.9)" text-anchor="middle">µLearn</text>
</svg>