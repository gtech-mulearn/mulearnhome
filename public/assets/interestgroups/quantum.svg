<svg width="400" height="250" viewBox="0 0 400 250" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="quantumGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#4338ca;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="400" height="250" fill="url(#quantumGrad)" rx="16"/>
  <circle cx="80" cy="125" r="120" fill="rgba(255,255,255,0.08)"/>
  <circle cx="320" cy="200" r="80" fill="rgba(255,255,255,0.06)"/>

  <g transform="translate(200, 95)" filter="url(#glow)">
    <ellipse cx="0" cy="0" rx="30" ry="12" fill="none" stroke="white" stroke-width="2" transform="rotate(30)"/>
    <ellipse cx="0" cy="0" rx="30" ry="12" fill="none" stroke="white" stroke-width="2" transform="rotate(-30)"/>
    <circle cx="0" cy="0" r="6" fill="#a855f7"/>
  </g>

  <text x="200" y="165" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="white" text-anchor="middle" filter="url(#glow)">Quantum Computing</text>

  <text x="200" y="208" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="rgba(255,255,255,0.9)" text-anchor="middle">µLearn</text>
</svg>